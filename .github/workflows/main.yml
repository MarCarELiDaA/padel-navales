name: Build iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios-release:
    runs-on: macos-15

    steps:

      # --------------------------------------------------
      # Descargar proyecto
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Instalar Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      # --------------------------------------------------
      # Versiones
      # --------------------------------------------------
      - name: Flutter version
        run: flutter --version

      - name: Xcode version
        run: xcodebuild -version

      # --------------------------------------------------
      # Dependencias
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # ==================================================
      # CERTIFICADO DE DISTRIBUCIÓN
      # ==================================================

      # --------------------------------------------------
      # Decodificar P12
      # --------------------------------------------------
      - name: Decode distribution certificate
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
        run: |
          echo "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/ios_distribution.p12"

          echo "=== ARCHIVO P12 ==="
          ls -lh "$RUNNER_TEMP/ios_distribution.p12"

      # --------------------------------------------------
      # Crear keychain temporal
      # --------------------------------------------------
      - name: Create temporary keychain
        run: |
          security create-keychain \
            -p "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

          security set-keychain-settings \
            -lut 21600 \
            "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -s "$RUNNER_TEMP/build.keychain-db"

          security list-keychains \
            -d user \
            -s "$RUNNER_TEMP/build.keychain-db"

      # --------------------------------------------------
      # Instalar certificado de distribución
      # --------------------------------------------------
      - name: Install distribution certificate
        env:
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          security import "$RUNNER_TEMP/ios_distribution.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

      # --------------------------------------------------
      # Permitir acceso a la clave privada
      # --------------------------------------------------
      - name: Configure keychain access
        run: |
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

      # --------------------------------------------------
      # Comprobar certificado instalado
      # --------------------------------------------------
      - name: Check installed certificate
        run: |
          echo "=========================================="
          echo "CERTIFICADOS DE FIRMA INSTALADOS"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # ==================================================
      # PROVISIONING PROFILE
      # ==================================================

      # --------------------------------------------------
      # Instalar provisioning profile
      # --------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_DISTRIBUTION_MOBILEPROVISION: ${{ secrets.IOS_DISTRIBUTION_MOBILEPROVISION }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_DISTRIBUTION_MOBILEPROVISION" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/4b6f5309-f013-464d-9f10-f008b2a23c03.mobileprovision"

      # --------------------------------------------------
      # Comprobar provisioning profile
      # --------------------------------------------------
      - name: Check provisioning profile
        run: |
          echo "=========================================="
          echo "PROVISIONING PROFILES"
          echo "=========================================="

          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # ==================================================
      # EXPORT OPTIONS
      # ==================================================

      # --------------------------------------------------
      # Crear ExportOptions.plist
      # --------------------------------------------------
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>TF3449NDJD</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.padelnavales.app</key>
                  <string>Padel Navales App Store Distribution</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

      # --------------------------------------------------
      # Mostrar ExportOptions
      # --------------------------------------------------
      - name: Check ExportOptions
        run: |
          cat ios/ExportOptions.plist

      # ==================================================
      # BUILD
      # ==================================================

      # --------------------------------------------------
      # Crear Archive
      # --------------------------------------------------
      - name: Build iOS archive
        run: |
          flutter build ipa \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}

      # ==================================================
      # EXPORTAR IPA
      # ==================================================

      # --------------------------------------------------
      # Exportar IPA firmado
      # --------------------------------------------------
      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      # --------------------------------------------------
      # Comprobar IPA
      # --------------------------------------------------
      - name: Check generated IPA
        run: |
          echo "=========================================="
          echo "IPA GENERADA"
          echo "=========================================="

          ls -lh build/ios/ipa/

      # --------------------------------------------------
      # Subir IPA
      # --------------------------------------------------
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: padel-navales-ios-release
          path: build/ios/ipa/*.ipa
          if-no-files-found: error