```yaml
name: Build iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios-release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

      # ---------------------------------------------------------
      # IMPORTAR CERTIFICADO DE DISTRIBUCIÓN
      # ---------------------------------------------------------
      - name: Import iOS Distribution Certificate
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          echo "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/ios_distribution.p12"

          security create-keychain \
            -p "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -s "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

          security import "$RUNNER_TEMP/ios_distribution.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

      # ---------------------------------------------------------
      # INSTALAR PROVISIONING PROFILE
      # ---------------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/Padel_Navales_App_Store_Distribution.mobileprovision"

      # ---------------------------------------------------------
      # APP STORE CONNECT API KEY
      # ---------------------------------------------------------
      - name: Create App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"

          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      # ---------------------------------------------------------
      # EXPORT OPTIONS
      # ---------------------------------------------------------
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>TF3449NDJD</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.padelnavales.app</key>
                  <string>Padel Navales App Store Distribution</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      # ---------------------------------------------------------
      # BUILD ARCHIVE
      # ---------------------------------------------------------
      - name: Build iOS archive
        run: |
          flutter build ipa \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}

      # ---------------------------------------------------------
      # EXPORT IPA FIRMADA
      # ---------------------------------------------------------
      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      # ---------------------------------------------------------
      # SUBIR IPA
      # ---------------------------------------------------------
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: padel-navales-ios-release
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
```
