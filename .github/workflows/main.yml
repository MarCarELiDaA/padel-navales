name: Build iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios-release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

           # --------------------------------------------------
      # DIAGNÓSTICO DEL CERTIFICADO P12
      # --------------------------------------------------
      - name: Diagnose P12
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          echo "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/ios_distribution.p12"

          echo "=== ARCHIVO P12 ==="
          ls -lh "$RUNNER_TEMP/ios_distribution.p12"

          echo "=== COMPROBANDO CONTRASEÑA Y P12 ==="
          printf '%s\n' "$IOS_DISTRIBUTION_P12_PASSWORD" | \
            openssl pkcs12 \
              -info \
              -in "$RUNNER_TEMP/ios_distribution.p12" \
              -noout \
              -passin stdin
           # --------------------------------------------------
      # Instalar provisioning profile
      # --------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_DISTRIBUTION_MOBILEPROVISION: ${{ secrets.IOS_DISTRIBUTION_MOBILEPROVISION }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_DISTRIBUTION_MOBILEPROVISION" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/4b6f5309-f013-464d-9f10-f008b2a23c03.mobileprovision"

      # --------------------------------------------------
      # Diagnóstico del certificado instalado
      # --------------------------------------------------
      - name: Check installed certificate
        run: |
          echo "=== CERTIFICADOS DE FIRMA INSTALADOS ==="
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" || true
      # --------------------------------------------------
      # Crear ExportOptions.plist
      # --------------------------------------------------
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>TF3449NDJD</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.padelnavales.app</key>
                  <string>Padel Navales App Store Distribution</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      # --------------------------------------------------
      # Comprobar certificado y perfil
      # --------------------------------------------------
      - name: Check signing configuration
        run: |
          echo "=== CERTIFICADOS ==="
          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db" || true

          echo ""
          echo "=== PROVISIONING PROFILES ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # --------------------------------------------------
      # Crear archivo de configuración manual de firma
      # --------------------------------------------------
      - name: Configure manual signing
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :objects:$(grep -B2 -A2 'PRODUCT_BUNDLE_IDENTIFIER = com.padelnavales.app' ios/Runner.xcodeproj/project.pbxproj | grep -m1 '^[[:space:]]*[A-F0-9]\{24\}' | tr -d ' ;'):buildSettings:CODE_SIGN_STYLE Manual" \
            ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

      # --------------------------------------------------
      # Crear Archive
      # --------------------------------------------------
      - name: Build iOS archive
        run: |
          flutter build ipa \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}

      # --------------------------------------------------
      # Exportar IPA firmado
      # --------------------------------------------------
      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      # --------------------------------------------------
      # Subir IPA
      # --------------------------------------------------
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: padel-navales-ios-release
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
