name: Build iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios-release:
    runs-on: macos-26

    steps:

      # ==================================================
      # PROYECTO
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # FLUTTER
      # ==================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

      # ==================================================
      # CERTIFICADO P12
      # ==================================================

      - name: Decode distribution certificate
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
        run: |
          echo "=== DECODIFICANDO P12 ==="

          echo "$IOS_DISTRIBUTION_P12" | base64 --decode \
            > "$RUNNER_TEMP/ios_distribution.p12"

          echo "=== ARCHIVO P12 ==="
          ls -lh "$RUNNER_TEMP/ios_distribution.p12"

      # --------------------------------------------------
      # Comprobar P12 antes de instalarlo
      # --------------------------------------------------

      - name: Validate P12
        env:
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          echo "=== VALIDANDO P12 ==="

          printf '%s\n' "$IOS_DISTRIBUTION_P12_PASSWORD" | \
            openssl pkcs12 \
              -info \
              -in "$RUNNER_TEMP/ios_distribution.p12" \
              -noout \
              -passin stdin

          echo "=== P12 VÁLIDO ==="

      # ==================================================
      # KEYCHAIN
      # ==================================================

      - name: Create temporary keychain
        run: |
          echo "=== CREANDO KEYCHAIN ==="

          security create-keychain \
            -p "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

          security set-keychain-settings \
            -lut 21600 \
            "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

          security list-keychains \
            -d user \
            -s "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -s "$RUNNER_TEMP/build.keychain-db"

          echo "=== KEYCHAIN CREADO ==="

      # ==================================================
      # INSTALAR CERTIFICADO
      # ==================================================

      - name: Install distribution certificate
        env:
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          echo "=== INSTALANDO CERTIFICADO ==="

          security import \
            "$RUNNER_TEMP/ios_distribution.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          echo "=== CERTIFICADO IMPORTADO ==="

      # ==================================================
      # CONFIGURAR ACCESO A CLAVE PRIVADA
      # ==================================================

      - name: Configure keychain access
        run: |
          echo "=== CONFIGURANDO ACCESO A CLAVE PRIVADA ==="

          security unlock-keychain \
            -p "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "temporary" \
            "$RUNNER_TEMP/build.keychain-db"

          echo "=== ACCESO CONFIGURADO ==="

      # ==================================================
      # DIAGNÓSTICO REAL DEL CERTIFICADO
      # ==================================================

      - name: Check signing identity
        run: |
          echo "=========================================="
          echo "CERTIFICADOS INSTALADOS"
          echo "=========================================="

          security find-certificate \
            -a \
            "$RUNNER_TEMP/build.keychain-db"

          echo ""
          echo "=========================================="
          echo "IDENTIDADES DE FIRMA"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

          echo ""
          echo "=========================================="
          echo "BUSCANDO APPLE DISTRIBUTION"
          echo "=========================================="

          security find-certificate \
            -a \
            -c "Apple Distribution" \
            "$RUNNER_TEMP/build.keychain-db"

      # ==================================================
      # PROVISIONING PROFILE
      # ==================================================

      - name: Install provisioning profile
        env:
          IOS_DISTRIBUTION_MOBILEPROVISION: ${{ secrets.IOS_DISTRIBUTION_MOBILEPROVISION }}
        run: |
          echo "=== INSTALANDO PROVISIONING PROFILE ==="

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_DISTRIBUTION_MOBILEPROVISION" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/4b6f5309-f013-464d-9f10-f008b2a23c03.mobileprovision"

          echo "=== PROVISIONING PROFILE INSTALADO ==="

      # --------------------------------------------------
      # Comprobar provisioning profile
      # --------------------------------------------------

      - name: Check provisioning profile
        run: |
          echo "=========================================="
          echo "PROVISIONING PROFILES"
          echo "=========================================="

          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # ==================================================
      # EXPORT OPTIONS
      # ==================================================

      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>TF3449NDJD</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.padelnavales.app</key>
                  <string>Padel Navales App Store Distribution</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

      # --------------------------------------------------
      # Mostrar configuración
      # --------------------------------------------------

      - name: Check ExportOptions
        run: |
          echo "=========================================="
          echo "EXPORT OPTIONS"
          echo "=========================================="

          cat ios/ExportOptions.plist

      # ==================================================
      # BUILD
      # ==================================================

      - name: Build iOS archive
        run: |
          flutter build ipa \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}

      # ==================================================
      # EXPORTAR IPA
      # ==================================================

      - name: Export signed IPA
        run: |
          echo "=========================================="
          echo "EXPORTANDO IPA FIRMADA"
          echo "=========================================="

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      # ==================================================
      # COMPROBAR IPA
      # ==================================================

      - name: Check generated IPA
        run: |
          echo "=========================================="
          echo "IPA GENERADA"
          echo "=========================================="

          ls -lh build/ios/ipa/

      # ==================================================
      # SUBIR IPA
      # ==================================================

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: padel-navales-ios-release
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      # ==================================================
      # SUBIR A TESTFLIGHT
      # ==================================================

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-type: ios
          app-path: build/ios/ipa/padel_navales.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
