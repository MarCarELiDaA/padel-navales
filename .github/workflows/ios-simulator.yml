name: Build iOS Simulator

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS Simulator
        run: flutter build ios --simulator --debug

      - name: Buscar iPad Pro 13 pulgadas
        shell: bash
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available | \
            grep "iPad Pro" | \
            grep "13-inch" | \
            head -n 1 | \
            sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')

          if [ -z "$DEVICE_UDID" ]; then
            echo "No se encontró un iPad Pro de 13 pulgadas."
            xcrun simctl list devices available
            exit 1
          fi

          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          echo "Simulador encontrado: $DEVICE_UDID"

      - name: Arrancar iPad
        shell: bash
        run: |
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Instalar aplicación
        shell: bash
        run: |
          xcrun simctl install "$DEVICE_UDID" build/ios/iphonesimulator/Runner.app

      - name: Abrir aplicación
        shell: bash
        run: |
          xcrun simctl launch "$DEVICE_UDID" com.padelnavales.app
          sleep 15

      - name: Hacer captura
        shell: bash
        run: |
          xcrun simctl io "$DEVICE_UDID" screenshot "$RUNNER_TEMP/padel-navales-ipad-13.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/padel-navales-ipad-13.png"

      - name: Subir captura
        uses: actions/upload-artifact@v4
        with:
          name: captura-padel-navales-ipad-13
          path: ${{ runner.temp }}/padel-navales-ipad-13.png